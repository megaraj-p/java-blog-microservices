<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Blog Post Published</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            padding: 40px;
        }

        .header {
            background-color: #059669;
            color: white;
            padding: 20px;
            border-radius: 8px 8px 0 0;
            text-align: center;
        }

        .content {
            padding: 30px;
            color: #333;
        }

        .post-card {
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 20px;
            margin: 20px 0;
        }

        .tag {
            display: inline-block;
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            margin: 2px;
        }

        .button {
            display: inline-block;
            background-color: #059669;
            color: white;
            padding: 12px 28px;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 20px;
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>New Post Published!</h1>
        </div>
        <div class="content">
            <p>Your blog post has been published successfully.</p>
            <div class="post-card">
                <h2 th:text="${title}">Post Title</h2>
                <p th:text="${excerpt}">Excerpt...</p>
                <p><strong>Read time:</strong> <span th:text="${readTimeMinutes}">5</span> minutes</p>
            </div>
            <a href="#" class="button">View Post</a>
        </div>
        <div class="footer">
            <p>Enterprise Blog Platform | Manage your notifications in account settings</p>
        </div>
    </div>
</body>

</html>
