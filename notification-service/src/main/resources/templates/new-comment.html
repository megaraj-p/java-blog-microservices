<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Comment on Your Post</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            padding: 40px;
        }

        .header {
            background-color: #7c3aed;
            color: white;
            padding: 20px;
            border-radius: 8px 8px 0 0;
            text-align: center;
        }

        .content {
            padding: 30px;
            color: #333;
        }

        .comment-card {
            border-left: 4px solid #7c3aed;
            background: #f5f3ff;
            padding: 16px;
            margin: 20px 0;
            border-radius: 0 6px 6px 0;
        }

        .button {
            display: inline-block;
            background-color: #7c3aed;
            color: white;
            padding: 12px 28px;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 20px;
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>New Comment!</h1>
        </div>
        <div class="content">
            <p>Someone commented on your post: <strong th:text="${postTitle}">Post Title</strong></p>
            <div class="comment-card">
                <p th:text="${contentPreview}">Comment content...</p>
            </div>
            <a href="#" class="button">View Comment</a>
        </div>
        <div class="footer">
            <p>Enterprise Blog Platform | Manage your notifications in account settings</p>
        </div>
    </div>
</body>

</html>
