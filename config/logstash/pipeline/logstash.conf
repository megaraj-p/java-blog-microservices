input {
  beats {
    port => 5044
  }
}

filter {
  # Parse structured JSON logs from Spring Boot services
  if [message] =~ /^\{/ {
    json {
      source => "message"
    }
    mutate {
      remove_field => ["message"]
    }
  }

  # Add timestamp
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }

  # Extract trace IDs for distributed tracing correlation
  if [traceId] {
    mutate {
      add_field => { "trace_id" => "%{traceId}" }
      add_field => { "span_id" => "%{spanId}" }
    }
  }

  # Enrich log level
  if [level] {
    mutate {
      uppercase => ["level"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "enterprise-blog-logs-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }

  # Output errors to stdout for debugging
  if [level] == "ERROR" {
    stdout {
      codec => rubydebug
    }
  }
}
