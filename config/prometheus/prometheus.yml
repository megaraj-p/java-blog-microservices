global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: enterprise-blog
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Service Discovery
  - job_name: service-discovery
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['service-discovery:8761']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: service-discovery

  # API Gateway
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: api-gateway

  # User Service
  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['user-service:8081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: user-service

  # Blog Service
  - job_name: blog-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['blog-service:8082']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: blog-service

  # Comment Service
  - job_name: comment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['comment-service:8083']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: comment-service

  # Search Service
  - job_name: search-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['search-service:8084']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: search-service

  # Notification Service
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification-service:8085']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: notification-service

  # Analytics Service
  - job_name: analytics-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['analytics-service:8086']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: analytics-service

  # PostgreSQL
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  # Kafka
  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']
