name: Enterprise Blog CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  JAVA_VERSION: '17'

jobs:
  # ─── Build & Test (matrix across all services) ───────────────────────────────
  build-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - service-discovery
          - api-gateway
          - user-service
          - blog-service
          - comment-service
          - search-service
          - notification-service
          - analytics-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build parent POM
        run: mvn install -N -DskipTests -q

      - name: Build & test service
        run: mvn verify -pl ${{ matrix.service }} --also-make -q
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/

  # ─── Security Scan ─────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ─── Docker Build & Push ───────────────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - service-discovery
          - api-gateway
          - user-service
          - blog-service
          - comment-service
          - search-service
          - notification-service
          - analytics-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          format: table
          severity: CRITICAL
          exit-code: 1

  # ─── Deploy to Dev ─────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: development
      url: http://dev.enterprise-blog.internal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply namespace and infrastructure
        run: |
          kubectl apply -f k8s/namespace.yml
          kubectl apply -f k8s/infrastructure/

      - name: Deploy all services
        run: |
          IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
          for service in service-discovery api-gateway user-service blog-service comment-service search-service notification-service analytics-service; do
            kubectl set image deployment/${service} ${service}=${{ env.IMAGE_PREFIX }}/${service}:${IMAGE_TAG} \
              -n enterprise-blog --record 2>/dev/null || \
            kubectl apply -f k8s/${service}/ -n enterprise-blog
          done

      - name: Wait for rollout
        run: |
          for service in service-discovery api-gateway user-service blog-service comment-service search-service notification-service analytics-service; do
            kubectl rollout status deployment/${service} -n enterprise-blog --timeout=180s
          done

  # ─── Smoke Tests ───────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - name: Health check API Gateway
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://dev.enterprise-blog.internal/actuator/health)
            if [[ "$STATUS" == "200" ]]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 10 attempts"
          exit 1

      - name: Verify service registration
        run: |
          curl -f http://dev.enterprise-blog.internal/actuator/health | \
          python3 -c "import sys, json; d=json.load(sys.stdin); sys.exit(0 if d.get('status')=='UP' else 1)"

  # ─── Deploy to Production (manual gate) ────────────────────────────────────
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://enterprise-blog.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to production with canary strategy
        run: |
          IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
          for service in service-discovery api-gateway user-service blog-service comment-service search-service notification-service analytics-service; do
            kubectl set image deployment/${service} ${service}=${{ env.IMAGE_PREFIX }}/${service}:${IMAGE_TAG} \
              -n enterprise-blog
            kubectl rollout status deployment/${service} -n enterprise-blog --timeout=300s
          done

  # ─── Notify on Failure ─────────────────────────────────────────────────────
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan, docker-build-push, deploy-dev, smoke-test]
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": ":red_circle: *CI/CD Pipeline Failed*",
              "attachments": [{
                "color": "#FF0000",
                "fields": [
                  {"title": "Repository", "value": "${{ github.repository }}", "short": true},
                  {"title": "Branch", "value": "${{ github.ref_name }}", "short": true},
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {"title": "Action URL", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
